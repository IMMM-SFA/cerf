name: cerf
channels:
    - conda-forge
dependencies:
    - python>=3.9
    - pip
    - pip:
        # runtime dependencies mirror [project.dependencies] in pyproject.toml; keep the two in sync
        - numpy>=1.19.4
        - scipy>=1.12
        - pandas>=1.1.4
        - rasterio>=1.2.3
        - PyYAML>=5.4.1
        - requests>=2.25.1
        - joblib>=1.0.1
        - matplotlib>=3.3.3
        - shapely>=2.0
        - geopandas>=0.9.0
        - cerf
