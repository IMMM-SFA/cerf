name: build

on: [push, pull_request]

jobs:

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ruff
        run: python -m pip install ruff
      - name: Lint (pyflakes + pycodestyle via ruff; config in pyproject.toml)
        run: ruff check cerf tests benchmark

  # Fast unit suite on a fresh checkout: no package-data download. Tests marked `package_data` are skipped by
  # tests/conftest.py, which is exactly what a contributor gets from `pip install -e .[test] && pytest`.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"
      - name: Unit tests without package data
        run: pytest -m "not package_data" --strict-markers

  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12']

    env:
      OS: ${{ matrix.os }}
      PYTHON: ${{ matrix.python-version }}
      # Directory the package data is installed into; cached across runs so the Zenodo download
      # (rate limited, intermittently 5xx, ~10 MB) only happens when the data URL for this cerf
      # version changes. The cache key deliberately depends on the data URL only, never on source
      # files, so refactoring the downloader does not force a cold download.
      CERF_DATA_DIR: ${{ github.workspace }}/.cerf_data

    steps:

      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Editable install so `import cerf` resolves to the checkout from every working directory
      # (pytest at the repo root and `python benchmark/run_reference.py` alike); the package data
      # linked below therefore lands in the one place both of them read from.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Resolve package data URL for this cerf version
        id: data-url
        run: |
          URL=$(python -c 'from importlib.metadata import version; from cerf.install_supplement import InstallSupplement as I; print(I.get_data_link(version("cerf")))')
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Package data URL: $URL"

      - name: Restore cached package data
        id: cache-data
        uses: actions/cache@v4
        with:
          path: ${{ env.CERF_DATA_DIR }}
          key: cerf-package-data-v1-${{ steps.data-url.outputs.url }}

      - name: Download package data (cache miss)
        if: steps.cache-data.outputs.cache-hit != 'true'
        # Zenodo returns 429/5xx in streaks; give CI more headroom than the library default.
        run: |
          python -c "import os, cerf; cerf.install_package_data(data_dir=os.environ['CERF_DATA_DIR'], max_attempts=8, timeout=600)"

      - name: Link package data into the installed package
        run: |
          PKG_DATA=$(python -c 'import cerf.package_data as p; print(p.get_data_directory())')
          mkdir -p "$PKG_DATA"
          cp -n "$CERF_DATA_DIR"/* "$PKG_DATA"/ || true
          ls "$PKG_DATA" | head -50

      - name: Full test suite with coverage (package-data tests must run, not skip)
        run: |
          pytest --require-package-data --strict-markers --cov=cerf --cov-report=xml --cov-report=term

      - name: Seeded end-to-end regression check
        run: python benchmark/run_reference.py --compare

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
